# l-torrents: Node/Express en 127.0.0.1:3011

include /etc/nginx/snippets/sin-copias.conf;
include /etc/nginx/snippets/pagina-404.conf;

location / {
    proxy_pass http://127.0.0.1:3011;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $torrents_client_ip;
    proxy_set_header X-Forwarded-For   $torrents_client_ip;
    proxy_set_header X-Forwarded-Proto $torrents_proto;

    # El proxy de portadas va a buscar imagenes a una web ajena, y anadir un
    # .torrent tambien se baja el fichero antes de pasarselo a transmission.
    # Con los 60 s de serie, un indexador lento devolvia un 504 que parecia un
    # fallo de aqui. El limite de verdad lo pone la aplicacion, que corta a los
    # 15 s y explica que paso.
    proxy_connect_timeout 15s;
    proxy_read_timeout    90s;
}
